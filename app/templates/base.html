<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Improvement Register{% endblock %}</title><style>
body{font-family:Arial,sans-serif;max-width:1050px;margin:2rem auto;padding:0 1rem;background:#f7f7f7;color:#222}header{border-bottom:3px solid #333;margin-bottom:1.5rem}section{background:white;padding:1rem;margin:1rem 0;border-radius:6px}label{display:block;margin-top:.7rem}input,select,button{padding:.55rem;margin-top:.2rem}table{width:100%;border-collapse:collapse}th,td{padding:.6rem;border-bottom:1px solid #ddd;text-align:left}.flash{padding:.7rem;background:#eee}.cards{display:flex;gap:1rem;flex-wrap:wrap}.card{border:1px solid #ddd;padding:.8rem;min-width:130px}
</style></head><body><header><h1>Service Improvement Register</h1><p>Fictional, organisation-neutral demonstrator</p></header>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="flash">{{ message }}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</body></html>
